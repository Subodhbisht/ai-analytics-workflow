spring.application.name=sql-agent-mcp-server
server.port=8084
spring.config.import=optional:file:secrets.env[.properties]
spring.ai.model.chat=ollama
spring.ai.ollama.chat.options.model=qwen3:14b
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.chat.options.num-ctx=4096

spring.ai.mcp.server.name=sql-agent
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=SQL generation, repair, and read-only execution for analytics workflows.

spring.datasource.url=jdbc:postgresql://172.20.5.221:5433/ao_analysis
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
