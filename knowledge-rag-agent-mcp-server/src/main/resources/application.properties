spring.application.name=knowledge-rag-agent-mcp-server
server.port=8085
spring.config.import=optional:file:secrets.env[.properties]
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash}

spring.ai.mcp.server.name=knowledge-rag-agent
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Grounded onboarding reason-code retrieval and answers.
