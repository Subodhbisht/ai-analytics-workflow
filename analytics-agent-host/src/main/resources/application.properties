spring.application.name=analytics-agent-host
server.port=8083
spring.profiles.active=ollama
spring.ai.mcp.client.name=analytics-agent-host
spring.ai.mcp.client.version=0.0.1
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=${ANALYTICS_MCP_REQUEST_TIMEOUT:120s}
spring.ai.mcp.client.toolcallback.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.mcp.client.common.autoconfigure.McpClientAutoConfiguration
spring.ai.mcp.client.streamable-http.connections.sql-agent.url=http://127.0.0.1:8084
spring.ai.mcp.client.streamable-http.connections.knowledge-rag-agent.url=http://127.0.0.1:8085
spring.ai.mcp.client.streamable-http.connections.result-analysis-agent.url=http://127.0.0.1:8086
